<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Simpli  simple international language</title>
  <desc id="desc">Promotional square card for Simpli</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)" rx="48"/>
  <text x="600" y="420" fill="#ecfdf5" font-family="Noto Sans, Helvetica, Arial, sans-serif" font-size="120" font-weight="800" text-anchor="middle">Simpli</text>
  <text x="600" y="540" fill="#99f6e4" font-family="Noto Sans, Helvetica, Arial, sans-serif" font-size="42" font-weight="600" text-anchor="middle">Simple international language</text>
  <text x="600" y="620" fill="#ccfbf1" font-family="Noto Sans, Helvetica, Arial, sans-serif" font-size="34" text-anchor="middle">English-style words · Indonesian-style grammar</text>
  <text x="600" y="680" fill="#ccfbf1" font-family="Noto Sans, Helvetica, Arial, sans-serif" font-size="34" text-anchor="middle">Phonetic spelling</text>
  <text x="600" y="880" fill="#f0fdfa" font-family="Noto Sans, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle">simpli.global</text>
  <text x="600" y="940" fill="#94a3b8" font-family="Noto Sans, Helvetica, Arial, sans-serif" font-size="26" text-anchor="middle">CC BY 4.0  attribute simpli.global</text>
